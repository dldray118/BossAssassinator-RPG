// Boss Assassinator RPG — Groovy Gradle build (course assignment baseline + quality plugins).
plugins {
    id "com.github.spotbugs" version "5.0.12"
    id "checkstyle"
}

apply plugin: 'application'
apply plugin: 'jacoco'



mainClassName = 'game.engine.Main'

run {
    standardInput = System.in
}

// Maven Central replaces deprecated jcenter; keeps dependency resolution reproducible.
repositories {
    mavenCentral()
}

// JUnit 4 scoped to tests only — not bundled with production bytecode.
dependencies {
    testImplementation "junit:junit:4.13.2"
}

jacocoTestReport {
    dependsOn test // report runs after test task completes
}
jacoco {
    toolVersion = "0.8.8"
    reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}
jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}


apply plugin: 'checkstyle'
checkstyle {
    // Non-blocking: report issues without failing the build during local runs.
    ignoreFailures = true
    showViolations = false
}

tasks.withType(Checkstyle) {
    reports {
        // Report toggles vary by Checkstyle/Gradle version; enable in IDE or CI if needed.
    }
}
checkstyle {
    toolVersion = "8.8"
}




///////////////////////////////////////////////////////////////////////
// SpotBugs — static analysis on main sources
///////////////////////////////////////////////////////////////////////
// Prefer HTML report for local inspection; XML optional for tooling.
spotbugsMain {
    reports {
        xml.enabled = false
        html.enabled = true
    }
}
spotbugs {
    ignoreFailures = true
    showProgress = true
    effort = 'max'
}
