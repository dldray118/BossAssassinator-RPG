// Gradle build given in assignment 3
plugins {
    id "com.github.spotbugs" version "5.0.12"
    id "checkstyle"
    id "org.openjfx.javafxplugin" version "0.1.0"
}

apply plugin: 'application'
apply plugin: 'jacoco'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = "17.0.11"
    modules = ["javafx.controls", "javafx.graphics"]
}

mainClassName = 'game.engine.Main'

run {
    standardInput = System.in
}

tasks.register("runGui", JavaExec) {
    group = "application"
    description = "Run JavaFX desktop UI"
    mainClass.set("game.ui.BossAssassinatorApp")

    // Java 11+ needs JavaFX on the module path; classpath-only runs hit "runtime components are missing".
    def runtimeCp = sourceSets.main.runtimeClasspath
    def javafxJars = runtimeCp.filter { File f ->
        f.name.startsWith("javafx-") && f.name.endsWith(".jar")
    }
    classpath = runtimeCp.filter { File f ->
        !(f.name.startsWith("javafx-") && f.name.endsWith(".jar"))
    }
    jvmArgs = [
            "--module-path", javafxJars.asPath,
            "--add-modules", "javafx.controls,javafx.graphics,javafx.base"
    ]
}

// mavenCentral: jcenter is deprecated and unmaintained.
repositories {
    mavenCentral()
}

// JUnit 5 on the test classpath only (BOM + Jupiter).
dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
}
jacoco {
    toolVersion = "0.8.8"
    reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}
jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}


apply plugin: 'checkstyle'
checkstyle {
    // Keep checkstyle a little quieter
    ignoreFailures = true
    showViolations = false
}

tasks.withType(Checkstyle) {
    reports {
    //    html.enabled = true
    //    xml.enabled = false
    }
}
checkstyle {
    toolVersion = "8.8"
}




///////////////////////////////////////////////////////////////////////
// Configure SpotBugs
///////////////////////////////////////////////////////////////////////
// To generate an HTML report instead of XML
spotbugsMain {
    reports {
        xml.enabled = false
        html.enabled = true
    }
}
spotbugs {
    ignoreFailures = true
    showProgress = true
    effort = 'max'
}
